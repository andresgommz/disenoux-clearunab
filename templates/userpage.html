<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel del Estudiante</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="../static/css/userpage.css" rel="stylesheet">
  <!-- Favicon para todas las páginas que usen este template -->
  <link rel="icon" href="../static/img/favicon.png" />
  
</head>
<body>
  <header class="container" style="padding:12px 16px 0 16px">
    <div class="brand">
      <div class="logo" aria-hidden="true"><img src="../static/img/favicon.png" width="100%" height="100%"></div>
      <div style="margin-left:8px; display:flex; align-items:center; gap:12px;">
        <div>
          <div style="font-weight:700" id="greeting">Hola, Estudiante</div>
          <div class="muted" style="font-size:12px">Panel del estudiante</div>
        </div>
        <!-- Theme toggle -->
        <button id="theme-toggle" class="btn" title="Alternar tema" style="height:36px;padding:6px 10px;font-weight:700">🌓</button>
        <button id="back-home" class="btn ghost" title="Volver al inicio" style="height:36px;padding:6px 10px;font-weight:700">Inicio</button>
        <!-- Logout: cerrar sesión del usuario -->
        <button id="logout-btn" class="btn ghost" title="Cerrar sesión" style="height:36px;padding:6px 10px;font-weight:700">Cerrar sesión</button>
      </div>
    </div>
  </header>
  

  <main class="container">
    <aside>
      <nav id="sidebar"></nav>
    </aside>

    <div id="content" class="grid gap-6"></div>

  </main>

  

  <script src="../static/js/userpage.js"></script>

  <!-- Footer verde removed -->
</body>
</html>
